version: v1.5
labels:
  - id: ride_hailing
    display_name: 网约车
    short_description: 网约车司机、商务车司机、代驾、出行服务相关企业
    prompt_text: 网约车司机、商务车司机、代驾、出行服务相关企业。企业名称或经营范围含"汽车服务"、"汽车租赁"、"出行"等关键词，且招聘岗位以网约车司机、商务车司机、代驾司机等客运出行类岗位为主的企业应归入此类。货车司机、道路货物运输类企业不属于此类，应归入"货运物流"。
    enabled: true
  - id: freight_logistics
    display_name: 货运物流
    short_description: C照货车司机、物流类公司、道路货物运输、运力调度相关企业
    prompt_text: C照货车司机、物流类公司、道路货物运输、货运司机、运力调度相关企业。企业名称或经营范围含"道路货物运输"、"货运"、"物流"、"运力"等关键词，且招聘岗位以货车司机、货运司机等货物运输类岗位为主的企业应归入此类。网约车司机、商务车司机等客运出行类企业不属于此类，应归入"网约车"。
    enabled: true
